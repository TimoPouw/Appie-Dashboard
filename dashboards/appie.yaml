# Appie-Dashboard: a ready-made dashboard for the Albert Heijn integration.
# Only built-in Home Assistant cards; no custom cards needed.
# Paste into a new dashboard (Raw configuration editor), see README "Dashboard".
title: Albert Heijn
views:
  - title: Overzicht
    path: overzicht
    icon: mdi:view-dashboard
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Vandaag
            heading_style: title
            icon: mdi:calendar-today
          - type: tile
            entity: sensor.albert_heijn_lijst_kosten
            name: Je lijst kost
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.albert_heijn_uitgaven_deze_maand
            name: Uitgegeven deze maand
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.albert_heijn_bonus_box
            name: Bonus Box
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.albert_heijn_koopjes
            name: Koopjes
            grid_options:
              columns: 6
          - type: tile
            entity: binary_sensor.albert_heijn_winkel_open
            name: Winkel open
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.albert_heijn_vergeet_niet
            name: Vergeet niet
            grid_options:
              columns: 6
      - type: grid
        cards:
          - type: heading
            heading: In je Bonus Box
            heading_style: title
            icon: mdi:gift-outline
          - type: markdown
            content: |
              {% set box = state_attr('sensor.albert_heijn_bonus_box', 'aanbiedingen') or [] %}
              {% set max = state_attr('sensor.albert_heijn_bonus_box', 'max_activaties') %}
              {% set aan = state_attr('sensor.albert_heijn_bonus_box', 'geactiveerd') or 0 %}
              {% if box %}
              **{{ aan }}{% if max %} van {{ max }}{% endif %} geactiveerd**
              <table>
              {% for o in box | sort(attribute='activated', reverse=true) %}
              <tr><td>{% if o.image %}<img src="{{ o.image }}" width="44">{% endif %}</td>
              <td>{{ '✅' if o.activated else '⬜' }} <b>{{ o.title }}</b><br>
              {% if o.mechanism %}<font color="#e8590c">{{ o.mechanism }}</font>{% endif %}{% if o.category %} · {{ o.category }}{% endif %}</td>
              <td align="right">{% if o.price is not none %}€ {{ '%.2f' | format(o.price) }}{% endif %}{% if o.price_was %}<br><s>€ {{ '%.2f' | format(o.price_was) }}</s>{% endif %}</td></tr>
              {% endfor %}
              </table>
              Activeren doe je in de Appie-app.
              {% else %}
              Je Bonus Box is (nog) leeg.
              {% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Vaak gekocht
            heading_style: title
            icon: mdi:cart-heart
          - type: markdown
            content: |
              {% set items = state_attr('sensor.albert_heijn_vaak_gekocht', 'producten') or [] %}
              {% if items %}
              <table>
              {% for p in items %}
              <tr><td>{{ p.rank }}.</td>
              <td>{% if p.entity_picture %}<img src="{{ p.entity_picture }}" width="40">{% endif %}</td>
              <td><b>{{ p.title }}</b><br>{{ p.times_bought }}× gekocht{% if p.bonus %} · <font color="#e8590c">{{ p.bonus }}</font>{% endif %}</td>
              <td>{% if p.on_list %}🛒 {{ p.quantity_on_list }}{% endif %}</td></tr>
              {% endfor %}
              </table>
              Op de lijst zetten: tabblad **Boodschappen**.
              {% else %}
              Nog aan het tellen. Dit duurt bij de eerste start even.
              {% endif %}
  - title: Boodschappen
    path: boodschappen
    icon: mdi:cart
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Boodschappenlijst
            heading_style: title
            icon: mdi:format-list-checks
          - type: tile
            entity: sensor.albert_heijn_lijst_kosten
            name: Kost je lijst
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.albert_heijn_bonus_voor_ons
            name: Bonus op je lijst
            state_content: on_list
            grid_options:
              columns: 6
          - type: todo-list
            entity: todo.albert_heijn_boodschappenlijst
            hide_completed: false
      - type: grid
        cards:
          - type: heading
            heading: Vaak gekocht
            heading_style: title
            icon: mdi:cart-heart
          - type: markdown
            content: |
              Tik op een product om het op je lijst te zetten.
          - type: tile
            entity: button.albert_heijn_vaak_gekocht_1
            show_entity_picture: true
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.albert_heijn_vaak_gekocht_1
            grid_options:
              columns: 6
          - type: tile
            entity: button.albert_heijn_vaak_gekocht_2
            show_entity_picture: true
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.albert_heijn_vaak_gekocht_2
            grid_options:
              columns: 6
          - type: tile
            entity: button.albert_heijn_vaak_gekocht_3
            show_entity_picture: true
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.albert_heijn_vaak_gekocht_3
            grid_options:
              columns: 6
          - type: tile
            entity: button.albert_heijn_vaak_gekocht_4
            show_entity_picture: true
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.albert_heijn_vaak_gekocht_4
            grid_options:
              columns: 6
          - type: tile
            entity: button.albert_heijn_vaak_gekocht_5
            show_entity_picture: true
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.albert_heijn_vaak_gekocht_5
            grid_options:
              columns: 6
          - type: tile
            entity: button.albert_heijn_vaak_gekocht_6
            show_entity_picture: true
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.albert_heijn_vaak_gekocht_6
            grid_options:
              columns: 6
          - type: tile
            entity: button.albert_heijn_vaak_gekocht_7
            show_entity_picture: true
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.albert_heijn_vaak_gekocht_7
            grid_options:
              columns: 6
          - type: tile
            entity: button.albert_heijn_vaak_gekocht_8
            show_entity_picture: true
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.albert_heijn_vaak_gekocht_8
            grid_options:
              columns: 6
          - type: tile
            entity: button.albert_heijn_vaak_gekocht_9
            show_entity_picture: true
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.albert_heijn_vaak_gekocht_9
            grid_options:
              columns: 6
          - type: tile
            entity: button.albert_heijn_vaak_gekocht_10
            show_entity_picture: true
            hide_state: true
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.albert_heijn_vaak_gekocht_10
            grid_options:
              columns: 6
      - type: grid
        cards:
          - type: heading
            heading: Vergeet niet
            heading_style: title
            icon: mdi:lightbulb-on-outline
          - type: markdown
            content: |
              {% set items = state_attr('sensor.albert_heijn_vergeet_niet', 'suggesties') or [] %}
              {% if items %}
              <table>
              {% for s in items %}
              <tr><td>{% if s.image %}<img src="{{ s.image }}" width="40">{% endif %}</td>
              <td><b>{{ s.title }}</b><br>{{ s.size or '' }}{% if s.is_bonus %} · <font color="#e8590c">{{ s.bonus_mechanism }}</font>{% endif %}</td>
              <td>{% if s.price is not none %}€ {{ '%.2f' | format(s.price) }}{% endif %}</td></tr>
              {% endfor %}
              </table>
              {% else %}
              Geen suggesties. Zet eerst wat producten op je lijst.
              {% endif %}
          - type: heading
            heading: Favoriete lijsten
            heading_style: subtitle
            icon: mdi:playlist-star
          - type: markdown
            content: |
              {% set lists = state_attr('sensor.albert_heijn_favoriete_lijsten', 'lijsten') or [] %}
              {% for l in lists %}
              - **{{ l.naam }}** ({{ l.aantal }} producten)
              {% else %}
              Je hebt nog geen favoriete lijsten in de app.
              {% endfor %}

              Zet een hele lijst op je boodschappenlijst met de actie
              *Favoriete lijst naar boodschappenlijst* (`appie.favorite_list_to_list`).

  - title: Bonus
    path: bonus
    icon: mdi:sale
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Bonus voor ons
            heading_style: title
            icon: mdi:sale
          - type: tile
            entity: sensor.albert_heijn_bonus_voor_ons
            name: Aanbiedingen
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.albert_heijn_bonus_voor_ons
            name: Op je lijst
            state_content: on_list
            icon: mdi:cart-check
            grid_options:
              columns: 6
          - type: markdown
            content: |
              {% set offers = state_attr('sensor.albert_heijn_bonus_voor_ons', 'offers') or [] %}
              {% set end = state_attr('sensor.albert_heijn_bonus_voor_ons', 'period_end') %}
              {% if end %}*Geldig t/m {{ as_timestamp(end) | timestamp_custom('%d-%m', true) }}*{% endif %}
              <table>
              {% for o in offers %}
              <tr><td>{% if o.image %}<img src="{{ o.image }}" width="44">{% endif %}</td>
              <td>{% if o.on_list %}🛒 {% endif %}<b>{{ o.title }}</b><br>
              <font color="#e8590c">{{ o.mechanism }}</font>{% if o.source == 'persoonlijk' %} · persoonlijk{% endif %}</td>
              <td>{% if o.price is not none %}€ {{ '%.2f' | format(o.price) }}{% endif %}{% if o.price_was %}<br><s>€ {{ '%.2f' | format(o.price_was) }}</s>{% endif %}</td></tr>
              {% endfor %}
              </table>
      - type: grid
        cards:
          - type: heading
            heading: Bonus Box
            heading_style: title
            icon: mdi:gift-outline
          - type: tile
            entity: sensor.albert_heijn_bonus_box
            name: In je Bonus Box
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.albert_heijn_bonus_box
            name: Geactiveerd
            state_content: geactiveerd
            icon: mdi:check-decagram
            grid_options:
              columns: 6
          - type: markdown
            content: |
              {% set box = state_attr('sensor.albert_heijn_bonus_box', 'aanbiedingen') or [] %}
              {% for o in box %}
              - {{ '✅' if o.activated else '⬜' }} **{{ o.title }}**{% if o.mechanism %}: {{ o.mechanism }}{% endif %}
              {% else %}
              Geen Bonus Box deze week.
              {% endfor %}
      - type: grid
        cards:
          - type: heading
            heading: Spotlight
            heading_style: title
            icon: mdi:star-circle
          - type: markdown
            content: |
              {% set offers = state_attr('sensor.albert_heijn_bonus_spotlight', 'offers') or [] %}
              <table>
              {% for o in offers %}
              <tr><td>{% if o.image %}<img src="{{ o.image }}" width="44">{% endif %}</td>
              <td>{% if o.on_list %}🛒 {% endif %}<b>{{ o.title }}</b><br><font color="#e8590c">{{ o.mechanism }}</font></td></tr>
              {% endfor %}
              </table>

  - title: Kassabonnen
    path: kassabonnen
    icon: mdi:receipt-text
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Uitgaven
            heading_style: title
            icon: mdi:cash-register
          - type: tile
            entity: sensor.albert_heijn_uitgaven_deze_maand
            name: Deze maand
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.albert_heijn_laatste_kassabon
            name: Laatste bon
            grid_options:
              columns: 6
          - type: statistics-graph
            entities:
              - sensor.albert_heijn_uitgaven_deze_maand
            stat_types:
              - max
            chart_type: bar
            period: month
            days_to_show: 365
            title: Per maand
          - type: markdown
            title: Per maand
            content: |
              {% set months = state_attr('sensor.albert_heijn_uitgaven_deze_maand', 'per_maand') or [] %}
              {% set top = (months | map(attribute='totaal') | max) if months else 0 %}
              <table>
              {% for m in months | reverse %}
              <tr><td>{{ m.naam }}</td><td align="right"><b>€ {{ '%.2f' | format(m.totaal) | replace('.', ',') }}</b></td>
              <td>{{ '█' * ((m.totaal / top * 12) | round(0, 'ceil') | int) if top else '' }}</td>
              <td>{{ m.bonnen }} bonnen</td></tr>
              {% endfor %}
              </table>
          - type: markdown
            title: Recente bonnen
            content: |
              {% set recent = state_attr('sensor.albert_heijn_laatste_kassabon', 'recent') or [] %}
              <table>
              {% for r in recent %}
              <tr><td>{{ as_timestamp(r.datetime) | timestamp_custom('%d-%m-%Y %H:%M') }}</td>
              <td>€ {{ '%.2f' | format(r.total) }}</td>
              <td>{% if r.pdf_url %}<a href="{{ r.pdf_url }}" target="_blank">PDF</a>{% endif %}</td></tr>
              {% endfor %}
              </table>
      - type: grid
        cards:
          - type: heading
            heading: Bon bekijken
            heading_style: title
            icon: mdi:receipt-text-check
          - type: tile
            entity: select.albert_heijn_kassabon
            name: Kies een bon
            features:
              - type: select-options
          - type: markdown
            content: |
              {% set e = 'sensor.albert_heijn_gekozen_kassabon' %}
              {% set items = state_attr(e, 'items') or [] %}
              {% if items %}
              **{{ as_timestamp(state_attr(e, 'datetime')) | timestamp_custom('%A %d-%m-%Y %H:%M') }}**
              {% if state_attr(e, 'pdf_url') %} · <a href="{{ state_attr(e, 'pdf_url') }}" target="_blank">Open PDF</a>{% endif %}

              <table>
              {% for i in items %}
              <tr><td>{{ i.quantity }}×</td><td>{{ i.name }}</td><td align="right">{% if i.amount is not none %}€ {{ '%.2f' | format(i.amount) }}{% endif %}</td></tr>
              {% endfor %}
              {% if state_attr(e, 'discount_total') %}
              <tr><td></td><td><b>Korting</b></td><td align="right"><b>€ {{ '%.2f' | format(state_attr(e, 'discount_total')) }}</b></td></tr>
              {% endif %}
              <tr><td></td><td><b>Totaal</b></td><td align="right"><b>€ {{ '%.2f' | format(states(e) | float(0)) }}</b></td></tr>
              </table>
              {% else %}
              Kies hierboven een bon.
              {% endif %}

  - title: Winkel
    path: winkel
    icon: mdi:store
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Je winkel
            heading_style: title
            icon: mdi:store
          - type: tile
            entity: binary_sensor.albert_heijn_winkel_open
            name: Nu open
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.albert_heijn_winkel
            name: Sluit om
            grid_options:
              columns: 6
          - type: markdown
            content: |
              {% set e = 'sensor.albert_heijn_winkel' %}
              {% if state_attr(e, 'adres') %}📍 {{ state_attr(e, 'adres') }}{% endif %}

              <table>
              {% for d in state_attr(e, 'openingstijden') or [] %}
              <tr><td>{{ d.dag | capitalize }}</td><td>{{ d.datum[8:10] }}-{{ d.datum[5:7] }}</td>
              <td>{% if d.open %}{{ d.open }} tot {{ d.dicht }}{% else %}gesloten{% endif %}</td></tr>
              {% endfor %}
              </table>
      - type: grid
        cards:
          - type: heading
            heading: Koopjes
            heading_style: title
            icon: mdi:tag-heart
          - type: tile
            entity: sensor.albert_heijn_koopjes
            name: Koopjes vandaag
          - type: markdown
            content: |
              {% set items = state_attr('sensor.albert_heijn_koopjes', 'items') or [] %}
              {% if items %}
              <table>
              {% for k in items | sort(attribute='is_favoriet', reverse=true) %}
              <tr><td>{% if k.is_favoriet %}⭐ {% endif %}<b>{{ k.title }}</b><br>{{ k.size or '' }} · {{ k.category or '' }}</td>
              <td>{% if k.price is not none %}€ {{ '%.2f' | format(k.price) }}{% endif %}{% if k.price_was %}<br><s>€ {{ '%.2f' | format(k.price_was) }}</s>{% endif %}</td></tr>
              {% endfor %}
              </table>
              {% else %}
              Geen koopjes op dit moment.
              {% endif %}
  - title: Sparen
    path: sparen
    icon: mdi:piggy-bank-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Koopzegels
            heading_style: title
            icon: mdi:ticket-percent
          - type: tile
            entity: sensor.albert_heijn_koopzegels_waarde
            name: Waard bij inleveren
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.albert_heijn_koopzegels
            name: Zegels
            grid_options:
              columns: 6
          - type: markdown
            content: |
              {% set z = 'sensor.albert_heijn_koopzegels' %}
              {% if states(z) in ['unavailable', 'unknown'] %}
              Je koopzegels zijn nog niet bekend.
              {% else %}
              {% set t = state_attr(z, 'zegels_per_boekje') | int(0) %}
              {% set n = state_attr(z, 'in_huidig_boekje') | int(0) %}
              **Huidig boekje:** {{ n }} van {{ t }} zegels{% if t %} ({{ (n * 100 / t) | round(0) | int }}%){% endif %}

              <table>
              <tr><td>Volle boekjes</td><td>{{ state_attr(z, 'volle_boekjes') }}</td></tr>
              <tr><td>Ingelegd</td><td>€ {{ '%.2f' | format(state_attr(z, 'ingelegd') or 0) }}</td></tr>
              <tr><td>Rente</td><td>€ {{ '%.2f' | format(state_attr(z, 'rente') or 0) }}</td></tr>
              <tr><td>Per zegel</td><td>€ {{ '%.2f' | format(state_attr(z, 'prijs_per_zegel') or 0) }}</td></tr>
              </table>
              {% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Air Miles, Premium en cadeaukaarten
            heading_style: title
            icon: mdi:wallet-outline
          - type: tile
            entity: sensor.albert_heijn_air_miles
            name: Air Miles
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.albert_heijn_premium
            name: AH Premium
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.albert_heijn_cadeaukaarten
            name: Cadeaukaarten
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.albert_heijn_premium_bespaard
            name: "Premium: bespaard"
            grid_options:
              columns: 6
          - type: tile
            entity: sensor.albert_heijn_premium_besparing
            name: "Premium: per jaar (schatting)"
            grid_options:
              columns: 6
          - type: heading
            heading: Uitdagingen
            heading_style: subtitle
            icon: mdi:flag-checkered
          - type: markdown
            content: |
              {% for u in state_attr('sensor.albert_heijn_uitdagingen', 'uitdagingen') or [] %}
              **{{ u.naam }}**{% if u.afgelopen %} (afgelopen){% endif %}

              <table>
              {% for s in u.stappen %}
              <tr><td>{{ s.label }}</td><td>{% if s.status == 'COMPLETED' %}✓ gehaald{% elif s.status == 'FAILED' %}niet gehaald{% else %}{{ s.voortgang_tekst or s.voortgang }} van {{ s.doel_tekst or s.doel }}{% endif %}</td></tr>
              {% endfor %}
              </table>
              {% else %}
              Je doet nu niet mee aan een uitdaging.
              {% endfor %}
      - type: grid
        cards:
          - type: heading
            heading: Spaaracties
            heading_style: title
            icon: mdi:star-shooting-outline
          - type: markdown
            content: |
              <table>
              {% for a in state_attr('sensor.albert_heijn_spaaracties', 'acties') or [] %}
              <tr><td><b>{{ a.naam }}</b><br>{{ a.omschrijving or '' }}</td>
              <td>{{ a.punten or 0 }}{% if a.per_kaart %} / {{ a.per_kaart }}{% endif %}</td></tr>
              {% else %}
              <tr><td>Er lopen nu geen spaaracties.</td></tr>
              {% endfor %}
              </table>
          - type: heading
            heading: Gemiste bonus
            heading_style: subtitle
            icon: mdi:sale-outline
          - type: markdown
            content: |
              {% for p in state_attr('sensor.albert_heijn_gemiste_bonus', 'producten') or [] %}
              - **{{ p.title }}**: {{ p.bonus }} ({{ p.times_bought }}× gekocht)
              {% else %}
              Alles wat je vaak koopt en nu in de bonus is, staat al op je lijst.
              {% endfor %}
