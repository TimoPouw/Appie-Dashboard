      required: true
      example: Weekboodschappen
      selector:
        text:
    zoekterm:
      required: false
      example: halfvolle melk
      selector:
        text:
    product_id:
      required: false
      example: 441199
      selector:
        number:
          min: 1
          max: 99999999
