name: Release

# Two ways to release:
# - push a tag like v0.3.0 or v0.3.0-beta.1, or
# - run this workflow by hand (Actions → Release → Run workflow) on main; it
#   tags the commit with v<manifest version> itself.
# A version with a "-" becomes a pre-release, which HACS only offers to users
# who turned on beta versions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from manifest
        id: version
        run: |
          version="$(jq -r .version custom_components/appie/manifest.json)"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="## ${{ steps.version.outputs.version }}" \
            '$0 == v {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "Zie CHANGELOG.md." > notes.md; fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
